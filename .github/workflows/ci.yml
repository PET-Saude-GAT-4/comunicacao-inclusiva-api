name: CI

on:
  pull_request:
    branches: [main, develop]
  # Branch protection does not require a pull request to be up to date, so two
  # that each passed against an older base can still break it once merged. The
  # run on the merged commit is what catches that.
  push:
    branches: [main, develop]

# A new push to a pull request replaces its run, so pull request runs share a
# group per ref. Runs on main and develop are grouped by branch and commit and
# never cancelled, so every merge keeps its own result: a single shared group
# with cancel-in-progress off is not enough, as GitHub still drops a queued run
# when a newer one arrives. The branch is part of the key because the same
# commit can land on both, as when develop is fast-forwarded into main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# One job per check so that a failure names what broke, and so that each can be
# a required status check of its own. The job names double as the check names in
# branch protection: renaming one means updating the protection too.
#
# No step pushes or calls the API, so checkout does not leave the token in
# .git/config for install scripts and tests to read.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn lint

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn format:check

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn test

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comunicacao_test
        # The host port matches .env.test.example, which the suite loads with
        # override on: a DATABASE_URL set here would be replaced by the file's.
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp .env.test.example .env.test
      - run: yarn test:integration

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn build
