name: Set up Node and dependencies
description: Installs Node from .nvmrc, the dependencies with the Yarn release committed under .yarn/releases, and generates the Prisma client.

runs:
  using: composite
  steps:
    # No Corepack: .yarnrc.yml points yarnPath at the committed Yarn 4 release,
    # and the runner's Yarn 1 hands every command over to it, including the
    # cache-folder lookup setup-node makes. Corepack would download Yarn again.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: yarn

    # --immutable fails the run when yarn.lock is out of date instead of
    # rewriting it on the runner.
    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

    # The client in src/generated is not committed, and the type check, the
    # tests and the build all import it. It needs no database to generate.
    - name: Generate the Prisma client
      shell: bash
      run: yarn prisma generate
