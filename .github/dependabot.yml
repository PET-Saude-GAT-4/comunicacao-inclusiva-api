version: 2
updates:
  # Only the actions: npm updates are out of scope for now. Dependabot does not
  # look inside a composite action unless its folder is listed.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: ci
